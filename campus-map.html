<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Map</title>

  <!-- Leaflet CSS -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
    crossorigin=""
  />

  <!-- Leaflet JS -->
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
    crossorigin="">
  </script>

  <style>
    #map { 
      height: 500px;
      width: 100%;
      border-radius: 8px;
    }

    .popup-image {
      max-width: 200px;
      border-radius: 6px;
      height: auto;
      display: block;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <h1>Campus Map</h1>
  <div id="map"></div>

  <script>
    function initMap(mapDataUrl) {
      // Initialize the map
      const map = L.map('map').setView([8.3603, 124.8685], 17);

      // Base layers
      const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      });

      const satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics' }
      );

      openStreetMap.addTo(map);
      console.log("Base map loaded: " + new Date());

      // Marker groups for filtering
      const markerGroups = {};

      // Fetch the map data (JSON file)
      fetch(mapDataUrl)
        .then(response => response.json())
        .then(data => {
          data.forEach(pin => {
            const type = pin.locationType || "Other";

            // Create new group if it doesn’t exist
            if (!markerGroups[type]) {
              markerGroups[type] = L.layerGroup();
            }

            // Marker and popup
            const marker = L.marker([pin.lat, pin.lng]);
            const img = `<img src='${pin.img}' class='popup-image' alt='${pin.title}'>`;
            const popupContent = `
              ${img}
              <b>${pin.title}</b><br>
              ${pin.description}<br>
              <small>${type}</small>
            `;

            marker.bindPopup(popupContent);
            markerGroups[type].addLayer(marker);

            console.log(`${pin.name} marker loaded.`);
          });

        
          Object.values(markerGroups).forEach(group => group.addTo(map));

        
          const baseMaps = {
            "OpenStreetMap": openStreetMap,
            "Satellite": satellite
          };

          
          const overlayMaps = {};
          Object.keys(markerGroups).forEach(type => {
            overlayMaps[type] = markerGroups[type];
          });

          
          L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
        })
        .catch(err => console.error('Error loading JSON:', err));
    }

    document.addEventListener("DOMContentLoaded", () => {
      initMap('campus-map.json'); 
    });
  </script>
</body>
</html>
